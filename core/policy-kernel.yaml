version: "0.2.0rc1"
runtime_load_set:
  - core/POLICY_KERNEL.md
  - selected_project_profile
  - current_work_package
  - relevant_playbook_only
invariants:
  preauthorize_l0_l1: true
  raw_evidence_export: false
  builder_controls_final_verification: false
  checkpoint_requires_reply: false
  continue_when_unblocked_work_exists: true
  default_state: CONTINUE
  no_human_escalation_if_machine_verifiable: true
  sha256_human_copy_paste_forbidden: true
  subagent_direct_owner_escalation: false
  pull_request_controls_active_verifier: false
  evidence_artifacts_recalculated: true
  symlink_and_path_escape_allowed: false
  team_standard_l2_decision_mode: bounded_plain_language_choice
  team_standard_l2_requires_owner_signature: false
  solo_fast_l2_decision_mode: signed_exact_scope_receipt
  solo_fast_l2_requires_owner_signature: true
  regulated_l2_decision_mode: signed_exact_scope_receipt
  regulated_l2_requires_owner_signature: true
  l3_binds_complete_operation_payload: true
  routine_review_submission_pre_authorized: true
  routine_review_owner_response_required: false
  routine_review_public_repository_required: true
  private_review_requires_separate_recorded_pair_authorization: true
  routine_review_sensitive_payload_allowed: false
  routine_review_new_access_allowed: false
interruptions:
  allowed:
    - unresolved_l2_product_decision
    - concrete_l3_operation
    - operational_action
    - necessary_uat
  strict_action_required_package: true
