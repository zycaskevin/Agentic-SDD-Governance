name: broker-native

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broker-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-af-unix:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out the candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-governance.lock
      - name: Install hash-locked governance dependencies
        run: python -m pip install --require-hashes -r requirements-governance.lock
      - name: Run real AF_UNIX publication tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_broker_native -v
