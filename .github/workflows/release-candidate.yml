name: release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-v0.2.0rc1
  cancel-in-progress: false

env:
  RELEASE_VERSION: 0.2.0rc1
  WHEEL_NAME: agentic_sdd_governance-0.2.0rc1-py3-none-any.whl
  PIP_DEFAULT_TIMEOUT: "30"
  PIP_RETRIES: "3"

jobs:
  require-release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail unless this dispatch targets the exact release tag
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"

  native-package-readiness:
    needs: require-release-tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out the candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-governance.lock
            requirements-release.lock
      - name: Install hash-locked build dependencies
        run: python -m pip install --require-hashes -r requirements-governance.lock -r requirements-release.lock
      - name: Run source Green before packaging
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python -m sddgov.cli validate .
      - name: Build candidate distributions without dependency resolution
        run: python -m build --no-isolation --outdir "${RUNNER_TEMP}/dist"
      - name: Install candidate wheel into an isolated environment
        run: |
          python -m venv "${RUNNER_TEMP}/broker-venv"
          "${RUNNER_TEMP}/broker-venv/bin/python" -m pip install --require-hashes -r requirements-governance.lock
          "${RUNNER_TEMP}/broker-venv/bin/python" -m pip install --no-deps "${RUNNER_TEMP}"/dist/*.whl
          "${RUNNER_TEMP}/broker-venv/bin/python" -m pip check
      - name: Verify the optional strong-authorization Unix capability
        env:
          SDDGOV_EXPECT_INSTALLED_WHEEL: "1"
        run: |
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/broker-venv/bin/python" "${GITHUB_WORKSPACE}/tests/test_broker_native.py" -v
      - name: Run installed Pilot and source demo smoke
        run: |
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/broker-venv/bin/sddgov" pilot quick --output "${RUNNER_TEMP}/installed-pilot-quick.json"
          TMPDIR="${RUNNER_TEMP}" "${GITHUB_WORKSPACE}/demo/run.sh"
      - name: Run the complete fresh-wheel smoke on the native host
        run: |
          python -m pip download --require-hashes -r requirements-governance.lock --dest "${RUNNER_TEMP}/wheelhouse"
          PYTHONPATH=src python scripts/prepare_release_bundle.py \
            --dist "${RUNNER_TEMP}/dist" \
            --wheelhouse "${RUNNER_TEMP}/wheelhouse" \
            --lock requirements-governance.lock \
            --output "${RUNNER_TEMP}/release" \
            --version "$(tr -d '\n' < VERSION)" \
            --platform-label "native-${{ matrix.os }}-py312" \
            --report "${RUNNER_TEMP}/release-bundle.json"
          PYTHONPATH=src python scripts/fresh_wheel_smoke.py \
            --wheel "${RUNNER_TEMP}"/dist/*.whl \
            --expected-version "$(tr -d '\n' < VERSION)" \
            --bundle-root "${RUNNER_TEMP}/release/offline" \
            --output "${RUNNER_TEMP}/fresh-wheel-smoke.json"

  package-release-candidate:
    needs: native-package-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact release candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-governance.lock
            requirements-release.lock
      - name: Require the exact immutable release tag
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          test "$GITHUB_SHA" = "$(timeout --kill-after=5s 30s git rev-list -n 1 "v$RELEASE_VERSION")"
          test "$(uname -m)" = "x86_64"
      - name: Install hash-locked release tools
        run: python -m pip install --require-hashes -r requirements-release.lock
      - name: Validate the source contracts
        run: |
          python -m venv .governance-venv
          .governance-venv/bin/python -m pip install --require-hashes -r requirements-governance.lock
          .governance-venv/bin/python -m pip install --require-hashes -r requirements-release.lock
          PYTHONPATH=src .governance-venv/bin/python -m unittest discover -s tests -v
          PYTHONPATH=src .governance-venv/bin/python -m sddgov.cli validate .
      - name: Build and inspect distributions
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
          test -f "dist/$WHEEL_NAME"
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
      - name: Prepare a hash-locked offline dependency wheelhouse
        run: python -m pip download --require-hashes -r requirements-governance.lock --dest wheelhouse
      - name: Assemble inventoried release assets
        run: >-
          PYTHONPATH=src python scripts/prepare_release_bundle.py
          --dist dist
          --wheelhouse wheelhouse
          --lock requirements-governance.lock
          --output release
          --version "$RELEASE_VERSION"
          --platform-label linux-x86_64-py312
          --report release-bundle.json
      - name: Smoke-test only the fresh wheel
        run: >-
          PYTHONPATH=src python scripts/fresh_wheel_smoke.py
          --wheel "dist/$WHEEL_NAME"
          --expected-version "$RELEASE_VERSION"
          --bundle-root release/offline
          --output fresh-wheel-smoke.json
      - name: Upload the immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-${{ github.sha }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 7
