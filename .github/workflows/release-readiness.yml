name: release-readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DEFAULT_TIMEOUT: "30"
  PIP_RETRIES: "3"

concurrency:
  group: release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-package-readiness:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out the candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-governance.lock
            requirements-release.lock
      - name: Install hash-locked build dependencies
        run: python -m pip install --require-hashes -r requirements-governance.lock -r requirements-release.lock
      - name: Run source Green before packaging
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python -m sddgov.cli validate .
      - name: Build candidate distributions without dependency resolution
        run: python -m build --no-isolation --outdir "${RUNNER_TEMP}/dist"
      - name: Install candidate wheel into an isolated environment
        run: |
          python -m venv "${RUNNER_TEMP}/broker-venv"
          "${RUNNER_TEMP}/broker-venv/bin/python" -m pip install --require-hashes -r requirements-governance.lock
          "${RUNNER_TEMP}/broker-venv/bin/python" -m pip install --no-deps "${RUNNER_TEMP}"/dist/*.whl
          "${RUNNER_TEMP}/broker-venv/bin/python" -m pip check
      - name: Verify the optional strong-authorization Unix capability
        env:
          SDDGOV_EXPECT_INSTALLED_WHEEL: "1"
        run: |
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/broker-venv/bin/python" "${GITHUB_WORKSPACE}/tests/test_broker_native.py" -v
      - name: Run installed Pilot and source demo smoke
        run: |
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/broker-venv/bin/sddgov" pilot quick --output "${RUNNER_TEMP}/installed-pilot-quick.json"
          TMPDIR="${RUNNER_TEMP}" "${GITHUB_WORKSPACE}/demo/run.sh"
      - name: Run the complete fresh-wheel smoke on the native host
        run: |
          python -m pip download --require-hashes -r requirements-governance.lock --dest "${RUNNER_TEMP}/wheelhouse"
          PYTHONPATH=src python scripts/prepare_release_bundle.py \
            --dist "${RUNNER_TEMP}/dist" \
            --wheelhouse "${RUNNER_TEMP}/wheelhouse" \
            --lock requirements-governance.lock \
            --output "${RUNNER_TEMP}/release" \
            --version "$(tr -d '\n' < VERSION)" \
            --platform-label "native-${{ matrix.os }}-py312" \
            --report "${RUNNER_TEMP}/release-bundle.json"
          PYTHONPATH=src python scripts/fresh_wheel_smoke.py \
            --wheel "${RUNNER_TEMP}"/dist/*.whl \
            --expected-version "$(tr -d '\n' < VERSION)" \
            --bundle-root "${RUNNER_TEMP}/release/offline" \
            --output "${RUNNER_TEMP}/fresh-wheel-smoke.json"
