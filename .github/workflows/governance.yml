name: governance
on:
  # Security boundary: GitHub loads this workflow from the trusted base branch.
  # Candidate files are treated only as data and never imported or executed.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout untrusted candidate as data
        uses: actions/checkout@v4
        with:
          path: candidate
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      - name: Checkout trusted verifier
        uses: actions/checkout@v4
        with:
          path: trusted-verifier
          repository: ${{ github.repository }}
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies from trusted base
        run: python -m pip install ./trusted-verifier
      - name: Fetch exact trusted base into candidate object database
        if: github.event_name == 'pull_request_target'
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git -c core.hooksPath=/dev/null -C candidate fetch --no-tags --depth=1 "https://github.com/$BASE_REPOSITORY.git" "$BASE_SHA"
      - name: Enforce exact Merge policy
        env:
          SDDGOV_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          SDDGOV_TRUSTED_REVIEWERS_JSON: ${{ vars.SDDGOV_TRUSTED_REVIEWERS_JSON }}
          SDDGOV_TRUSTED_REVIEWERS_FILE: ${{ runner.temp }}/sddgov-trusted-reviewers.json
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          PYTHONPATH: ${{ github.workspace }}/trusted-verifier/src
        run: |
          if [ -n "$SDDGOV_TRUSTED_REVIEWERS_JSON" ]; then
            printf '%s' "$SDDGOV_TRUSTED_REVIEWERS_JSON" > "$SDDGOV_TRUSTED_REVIEWERS_FILE"
            chmod 600 "$SDDGOV_TRUSTED_REVIEWERS_FILE"
          else
            unset SDDGOV_TRUSTED_REVIEWERS_FILE
          fi
          python -m sddgov.cli merge verify "$CANDIDATE_ROOT" --base-ref "$SDDGOV_BASE_REF" --skip-local-checks
