name: governance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Enforce exact Merge policy
        env:
          SDDGOV_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          SDDGOV_TRUSTED_REVIEWERS_JSON: ${{ vars.SDDGOV_TRUSTED_REVIEWERS_JSON }}
          SDDGOV_TRUSTED_REVIEWERS_FILE: ${{ runner.temp }}/sddgov-trusted-reviewers.json
        run: |
          if [ -n "$SDDGOV_TRUSTED_REVIEWERS_JSON" ]; then
            printf '%s' "$SDDGOV_TRUSTED_REVIEWERS_JSON" > "$SDDGOV_TRUSTED_REVIEWERS_FILE"
          else
            unset SDDGOV_TRUSTED_REVIEWERS_FILE
          fi
          sddgov merge verify . --base-ref "$SDDGOV_BASE_REF"
