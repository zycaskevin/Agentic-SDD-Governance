[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdd-governance"
version = "0.2.0.dev1"
description = "Governance and evidence infrastructure for autonomous software engineering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sddgov = "sddgov.cli:main"
evidence = "sddgov.cli:evidence_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sddgov = ["resources/dep/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
