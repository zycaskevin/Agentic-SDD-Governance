[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdd-governance"
version = "0.2.0rc1"
description = "Governance and evidence infrastructure for autonomous software engineering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=50,<51", "jsonschema>=4.23,<5", "PyYAML>=6.0,<7"]

[project.scripts]
sddgov = "sddgov.cli:main"
evidence = "sddgov.cli:evidence_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sddgov = [
  "resources/dep/*",
  "resources/governance/*",
  "resources/governance/adapters/codex/*",
  "resources/governance/adapters/hermes/*",
  "resources/governance/collectors/*",
  "resources/governance/core/*",
  "resources/governance/docs/*",
  "resources/governance/policies/*",
  "resources/governance/profiles/*",
  "resources/governance/redaction/*",
  "resources/governance/schemas/*",
  "resources/governance/services/*",
  "resources/governance/templates/*",
  "resources/governance/skill/agentic-sdd-governance/*",
  "resources/governance/skill/agentic-sdd-governance/agents/*",
  "resources/governance/skill/agentic-sdd-governance/references/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
